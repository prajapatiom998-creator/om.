<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Om UPSC Premium + AI</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif}
  body{background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:#fff; min-height:100vh}
  header{text-align:center;padding:30px}
  h1{font-size:2.5rem}
 .container{max-width:1200px;margin:20px auto;padding:20px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px}
 .card{background:rgba(255,255,255,0.1); backdrop-filter:blur(10px); padding:25px; border-radius:15px; cursor:pointer; transition:0.3s}
 .card:hover{transform:translateY(-5px); background:rgba(255,255,255,0.2)}
 .login-btn{background:#ff6600; padding:12px 25px; border:none; border-radius:8px; color:white; font-size:16px; cursor:pointer; margin:10px}
  #chatbox,#notes{background:rgba(0,0,0,0.3); padding:20px; border-radius:10px; margin-top:20px; display:none}
  input{padding:10px; width:70%; border-radius:8px; border:none}
 .back-btn{background:#333; padding:8px 15px; border:none; border-radius:8px; color:white; cursor:pointer; margin-bottom:15px}
</style>
</head>
<body>
<header>
  <h1>🔥 Om UPSC Premium</h1>
  <p>AI + सभी Subject एक जगह</p>
  <button class="login-btn" onclick="alert('Login जोड़ने के लिए Firebase लगेगा। अभी फ्री वर्जन है')">Phone से Login</button>
  <button class="login-btn" onclick="alert('Login जोड़ने के लिए Firebase लगेगा। अभी फ्री वर्जन है')">Email से Login</button>
</header>

<div class="container" id="home">
  <h2>📚 सभी UPSC Subjects</h2>
  <div class="grid">
    <div class="card" onclick="openNotes('polity')"><h3>राजव्यवस्था</h3><p>Constitution, Polity</p></div>
    <div class="card" onclick="openNotes('history')"><h3>इतिहास</h3><p>प्राचीन, मध्यकालीन, आधुनिक</p></div>
    <div class="card" onclick="openNotes('geography')"><h3>भूगोल</h3><p>भारत + विश्व</p></div>
    <div class="card" onclick="openNotes('economy')"><h3>अर्थव्यवस्था</h3><p>Budget, Economy</p></div>
  </div>

  <div id="chatbox" style="display:block">
    <h2>🤖 AI से सवाल पूछो - Gemini</h2>
    <input id="q" placeholder="जैसे: संविधान का अनुच्छेद 32 क्या है?">
    <button class="login-btn" onclick="askAI()">पूछो</button>
    <p id="ans" style="margin-top:15px"></p>
  </div>
</div>

<div class="container" id="notes">
  <button class="back-btn" onclick="goHome()">← वापस</button>
  <div id="notes-content"></div>
</div>

<script>
const API_KEY = "यहां_अपनी_GEMINI_API_KEY_पेस्ट_करो"; // <-- ये बदलना है

const allNotes = {
  polity: `<h2>📘 राजव्यवस्था - UPSC Notes</h2>
  <h3>1. मूल अधिकार - अनुच्छेद 12 से 35</h3>
  <p>अनुच्छेद 14: समानता का अधिकार। अनुच्छेद 19: अभिव्यक्ति की स्वतंत्रता। अनुच्छेद 21: जीवन का अधिकार।</p>
  <h3>2. राज्य के नीति निर्देशक तत्व - अनुच्छेद 36 से 51</h3>
  <p>DPSP को न्यायालय में लागू नहीं किया जा सकता।</p>
  <h3>3. अनुच्छेद 32: संवैधानिक उपचारों का अधिकार</h3>
  <p>इसे डॉ. अंबेडकर ने "संविधान की आत्मा" कहा।</p>`,

  history: `<h2>📘 इतिहास - UPSC Notes</h2><h3>1. प्राचीन भारत</h3><p>सिंधु घाटी सभ्यता, मौर्य साम्राज्य...</p>`,
  geography: `<h2>📘 भूगोल - UPSC Notes</h2><h3>1. भारत का भौतिक स्वरूप</h3><p>हिमालय, गंगा का मैदान...</p>`,
  economy: `<h2>📘 अर्थव्यवस्था - UPSC Notes</h2><h3>1. Budget 2025</h3><p>मुख्य घोषणाएं...</p>`
};

function openNotes(subject){
  document.getElementById('home').style.display = 'none';
  document.getElementById('notes').style.display = 'block';
  document.getElementById('notes-content').innerHTML = allNotes[subject];
}

function goHome(){
  document.getElementById('home').style.display = 'block';
  document.getElementById('notes').style.display = 'none';
}

async function askAI(){
  const question = document.getElementById('q').value;
  document.getElementById('ans').innerText = "AI सोच रहा है...";

  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${AQ.Ab8RN6KrVG-yhLwPwXC3_h9OsrF2mo7ckZJFNzOCHCBOewJrzg}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      contents: [{parts:[{text: "तुम एक UPSC टीचर हो। हिंदी में जवाब दो। सवाल: " + question}]}]
    })
  });
  const data = await response.json();
  document.getElementById('ans').innerText = data.candidates[0].content.parts[0].text;
}
</script>
</body>
           </html>
